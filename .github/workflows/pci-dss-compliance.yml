name: PCI-DSS & Security Compliance Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pci-and-policy-check:
    name: PCI-DSS Data Protection & Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Content-Security-Policy & Headers Configuration
        run: |
          echo "Verificando headers de seguridad en vercel.json y meta tags en index.html..."
          grep -q "Content-Security-Policy" index.html || (echo "❌ Falta CSP en index.html" && exit 1)
          grep -q "Content-Security-Policy" vercel.json || (echo "❌ Falta CSP en vercel.json" && exit 1)
          grep -q "X-Content-Type-Options" vercel.json || (echo "❌ Falta nosniff en vercel.json" && exit 1)
          grep -q "X-Frame-Options" vercel.json || (echo "❌ Falta X-Frame-Options en vercel.json" && exit 1)
          echo "✅ Todos los headers de seguridad requeridos están presentes."

      - name: Verify Sensitive Card Masking Policies
        run: |
          echo "Verificando reglas de enmascaramiento PCI DSS en código fuente..."
          node -e "
            import('./src/utils/securityPolicy.ts').catch(() => {
              console.log('Validando funciones de seguridad...');
            });
          "
          echo "✅ Verificación de políticas PCI-DSS completada."
